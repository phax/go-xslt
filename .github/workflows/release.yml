name: Release desktop builds

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # A manual run does everything except publishing the release: it builds,
  # signs and notarizes, and leaves the files as workflow artifacts. Use it to
  # try the macOS signing without cutting a tag.
  workflow_dispatch:

# The wails3 CLI version is pinned to match desktop/go.mod's
# github.com/wailsapp/wails/v3 require line, so the CLI's task/bindings
# glue never drifts out of sync with the library the app actually imports.
env:
  WAILS3_VERSION: v3.0.0-alpha2.103
  NODE_VERSION: '22'

jobs:
  test:
    name: Test library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  build-macos-windows:
    name: Build macOS + Windows
    needs: test
    runs-on: macos-latest
    # Apple's notary service can take an hour or more for a new developer
    # account; the waits below are bounded well inside this.
    timeout-minutes: 240
    env:
      # Without the signing secrets (a fork, say) the macOS bundles stay
      # ad-hoc signed, as before.
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      # Both macOS archs build natively (Xcode's clang cross-targets Apple
      # Silicon + Intel from either host arch) and both Windows archs are
      # pure-Go cross-compiles (CGO_ENABLED=0), so this one macOS runner
      # covers all four of those variants without Docker.
      - name: Build macOS (arm64 + amd64) and Windows (amd64 + arm64)
        working-directory: desktop
        run: |
          make build-mac
          make build-win

      # --- macOS: Developer ID signing, notarization, stapling -------------
      # The certificate lives in a throwaway keychain that is deleted at the
      # end. Apple's "Developer ID G2" intermediate certificate has to be in
      # it too, or the identity does not count as valid; it is pinned by its
      # SHA-256 fingerprint.
      - name: Import the Developer ID certificate
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          FP="$(openssl x509 -inform der -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$FP" = "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" \
            || { echo "unexpected Developer ID G2 certificate: $FP"; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "no valid Developer ID Application identity in the keychain"; exit 1; }
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign the macOS .app bundles
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        run: |
          set -euo pipefail
          for app in go-xslt-darwin-arm64.app go-xslt-darwin-amd64.app; do
            codesign --force --deep --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      # Both bundles are submitted first and waited for afterwards, so the two
      # Apple queues run side by side. Anything but "Accepted" fails the job
      # (with Apple's log), and so the release is never published.
      - name: Notarize the macOS .app bundles
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
          NOTARY=(xcrun notarytool --keychain-profile ci --keychain "$KEYCHAIN")
          for arch in arm64 amd64; do
            ditto -c -k --keepParent "go-xslt-darwin-$arch.app" "notarize-$arch.zip"
            "${NOTARY[@]}" submit "notarize-$arch.zip" --output-format json > "submit-$arch.json"
            echo "submitted $arch: $(jq -r .id "submit-$arch.json")"
          done
          failed=0
          for arch in arm64 amd64; do
            id="$(jq -r .id "submit-$arch.json")"
            "${NOTARY[@]}" wait "$id" --timeout 3h > /dev/null || true
            status="$("${NOTARY[@]}" info "$id" --output-format json | jq -r .status)"
            echo "$arch: $status"
            if [ "$status" != "Accepted" ]; then
              "${NOTARY[@]}" log "$id" || true
              failed=1
            fi
          done
          exit $failed

      - name: Staple the notarization tickets
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        run: |
          set -euo pipefail
          for app in go-xslt-darwin-arm64.app go-xslt-darwin-amd64.app; do
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          rm -f notarize-*.zip submit-*.json

      - name: Remove the signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # A directory isn't a valid single-file release asset, so zip each
      # .app (signed and notarized above, ad-hoc signed without the secrets)
      # before upload. -y preserves the bundle's symlinks.
      - name: Zip the macOS .app bundles
        working-directory: desktop/build/bin
        run: |
          zip -r -y go-xslt-darwin-arm64.app.zip go-xslt-darwin-arm64.app
          zip -r -y go-xslt-darwin-amd64.app.zip go-xslt-darwin-amd64.app

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-windows
          path: |
            desktop/build/bin/go-xslt-darwin-arm64.app.zip
            desktop/build/bin/go-xslt-darwin-amd64.app.zip
            desktop/build/bin/go-xslt-windows-amd64.exe
            desktop/build/bin/go-xslt-windows-arm64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Linux needs real CGo (GTK4 + WebKitGTK 6.0 — Wails v3's default,
      # non-legacy Linux stack per its own internal/doctor/packagemanager/
      # apt.go; the older libgtk-3-dev/libwebkit2gtk-4.1-dev pair is only
      # for a build opting into `-tags gtk3`, which this one doesn't).
      # Installing these lets wails3's own build:native task run directly
      # on this runner instead of falling back to the ~800MB wails-cross
      # Docker image.
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Build Linux (amd64)
        working-directory: desktop
        run: make build-linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/build/bin/go-xslt-linux-amd64
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos-windows, build-linux]
    # A manual run (workflow_dispatch) only leaves artifacts behind.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create/update the GitHub release for this tag
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
