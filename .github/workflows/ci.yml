name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Build, vet, test (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -p 1: the streaming tests assert a peak-heap SLOPE, which only means
      # something when the package under test is not fighting the other
      # packages' test binaries for CPU (on a shared 2-core runner the collector
      # falls behind and bounded runs read as growing).
      - name: go test
        run: go test -p 1 ./...

  windows:
    # Filesystem-relative resolution (BaseDir, file: URIs) is OS-specific, so the
    # Linux job cannot see regressions in it (issue #1). Run the targeted tests
    # on a real Windows runner; the full conformance suites stay on Linux.
    name: Windows (file URIs, BaseDir-relative resolution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go test (file URI handling)
        run: go test ./internal/fileuri ./engine
